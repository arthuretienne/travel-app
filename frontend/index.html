<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://skusku.life/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Planifiez votre voyage parfait en quelques minutes avec l'IA. Skusku trouve des destinations, vols et hôtels personnalisés selon votre style et budget." />
    <meta name="keywords" content="planificateur voyage IA, voyage pas cher, vols pas chers, hôtels, voyage personnalisé, voyage groupe, AI travel planner, cheap flights" />
    <meta name="theme-color" content="#0D9488" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://skusku.life/" />
    <meta property="og:title" content="Skusku — Planificateur de voyage IA | Trouvez votre voyage parfait" />
    <meta property="og:description" content="Planifiez votre voyage parfait en quelques minutes. Destinations, vols et hôtels personnalisés selon votre style et budget." />
    <meta property="og:site_name" content="Skusku" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Skusku — Planificateur de voyage IA" />
    <meta name="twitter:description" content="Planifiez votre voyage parfait en quelques minutes. Destinations, vols et hôtels personnalisés." />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Skusku",
      "url": "https://skusku.life",
      "description": "Planificateur de voyage IA qui trouve des destinations, vols et hôtels personnalisés.",
      "applicationCategory": "TravelApplication",
      "operatingSystem": "Web",
      "inLanguage": ["fr", "en"],
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR",
        "description": "Gratuit — 10 recherches par mois"
      }
    }
    </script>

    <!-- Analytics (privacy-first, no cookie banner needed). src/lib/analytics.js
         calls window.plausible for custom funnel events. Register the domain
         "skusku.life" in the Plausible dashboard for events to be recorded. -->
    <script defer data-domain="skusku.life" src="https://plausible.io/js/script.js"></script>

    <title>Skusku — Planificateur de voyage IA | Vols & Hôtels pas chers</title>
    <!-- Fonts: DM Sans (body) + Fraunces (display) + JetBrains Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
